name: default
version: 1
artifacts:
  - id: proposal
    phase: propose
    generates: proposal.md
    template: proposal.md
    description: "Предложение: зачем нужно изменение и его границы"
    instruction: |
      Создай предложение: объясни, ЗАЧЕМ нужно изменение, и определи его границы.

      - перед записью прочитай request.md и evidence/research.md: запрос задаёт цели и границы, evidence даёт факты о коде и спецификациях; расхождение между ними решается явно в разделе «Расхождения с запросом», а не молча;
      - предложение — документ согласования проблемы, границ и состава изменения;
      - если к разделу нет применимой информации, укажи «—».

      Не включай: точные требования и сценарии; имена файлов, функций и модулей; технические решения; задачи реализации.

      Объём: до 40 строк.

      ## Зачем — 1–3 предложения о проблеме, какую проблему решает, почему сейчас.
      ## Границы изменения — подразделы «Входит» и «Не входит».
      ## Функциональности — новые и изменяемые capability с идентификаторами (`sbox spec list --json`); для новой capability придумай code в kebab-case. Если поведение продукта не меняется, укажи skip_specs: true в блоке sbox-result.
      ## Внешнее влияние — затронутые потребители, контракты, зависимости; несовместимые изменения помечай **BREAKING**.
      ## Расхождения с запросом — по одному пункту на каждое отступление предложения от запроса или от evidence: что говорит источник, решение, причина; продублируй их в deviations блока sbox-result. Если расхождений нет, «—».

      В блоке sbox-result укажи size (small | normal | large), complexity для реализации и ревью и deviations, если они есть.
    requires: []

  - id: specs
    phase: plan
    generates: "specs/**/*.{yml,yaml,md}"
    description: Дельты спецификаций
    skippable: true
    instruction: |
      Создай дельты спецификаций: определи, ЧТО должна делать система после изменения.

      - перед записью прочитай proposal.md и текущие спецификации затронутых capability (`sbox spec show <code> --json`);
      - описывай наблюдаемое поведение с точки зрения пользователя или внешнего контракта;
      - каждое утверждение проверяемо одним тестом: одно поведение, одно действие, один наблюдаемый результат;
      - формулировки бери из glossary.md;
      - по одной дельте на capability из раздела «Функциональности» предложения.

      Не включай: архитектурные решения, структуры данных, алгоритмы, задачи разработки.

      Формат дельты задаёт адаптер спецификаций проекта, его инструкция приложена ниже.
    requires: [proposal]

  - id: design
    phase: plan
    generates: design.md
    template: design.md
    description: "Дизайн-документ: общая картина, контракты, решения, вопросы"
    instruction: |
      Создай дизайн-документ: покажи человеку общую картину и собери все решения в одном месте.

      - перед записью прочитай proposal.md, дельты specs/ и architecture.md;
      - раздел «Общая картина» описывает, как будет работать изменяемая функциональность целиком: путь пользователя, участвующие компоненты, что меняется в каждом; одна схема потока данных;
      - раздел «Единообразие» называет существующий модуль-образец из Evidence Pack или wiki, перечисляет отступления от него и причины; без образца объясни, почему аналога нет. Если изменение добавляет модуль, пакет, плагин или проект, заполни строки «Образец: `X`» и «Новый модуль: `Y`» идентификаторами, как они встречаются в коде и конфигах, и перечисли места подключения образца из Evidence Pack: каждому нужна задача в tasks.md либо строка «Исключения подключения» с причиной; на верификации `sbox wiring` покажет файлы, где образец есть, а новый модуль нет;
      - раздел «Контракты» перечисляет изменения интерфейсов: API, события, схемы, структура UI и идентификаторы для тестов;
      - раздел «Решения»: каждое с идентификатором D1, D2…, обоснованием, альтернативами и последствиями; флаг promote, если решение стоит сделать постоянным правилом;
      - раздел «Вопросы, требующие решения»: таблица с приоритетом P0 (нельзя писать спецификации и тесты), P1 (меняет дизайн, но есть рекомендация), P2 (вкусовщина), вариантами, рекомендацией и влиянием; продублируй вопросы в блоке sbox-result;
      - раздел «Соответствие правилам»: каждое применимое правило из rules пакета и как дизайн его соблюдает;
      - «Риски и компромиссы» в формате «риск → мера снижения»; «Стратегия проверки» по уровням из testing.md; «Миграция и откат», если применимо.

      Не включай: мотивацию и границы из proposal; задачи; построчную реализацию.

      Объём: до 120 строк. Дизайн читают все следующие роли на каждом запуске, каждая лишняя строка умножается на число запусков. Не пересказывай требования и сценарии из дельт: ссылайся на них по названию.
    requires: [proposal, specs]

  - id: tasks
    phase: plan
    generates: tasks.md
    template: tasks.md
    description: Проверяемый список задач реализации
    instruction: |
      Создай список задач: разбей реализацию на проверяемые шаги.

      - перед записью прочитай дельты specs/ и design.md;
      - группируй задачи под нумерованными заголовками `##`;
      - каждая задача — флажок `- [ ] X.Y Описание`; задачи без флажка не отслеживаются;
      - упорядочи по зависимостям: подготовка → основная реализация → проверки;
      - в каждой задаче ссылайся на утверждение спецификации или помечай её как техническую;
      - добавь задачи на прогон проверок из testing.md (тесты, типы, линтеры).

      Не включай: новые требования; пересмотр решений; ручные проверки и шаги, требующие человека; написание или изменение тестов (их пишет tester до реализации).
    requires: [specs, design]

  - id: coverage
    phase: cover
    generates: coverage.yaml
    template: coverage.yaml
    description: Связь сценариев с автотестами
    instruction: |
      Заполни coverage.yaml: для каждого утверждения из дельт specs/ укажи тесты (путь, полное имя, уровень) либо manual с причиной.

      - имя теста строится по правилу из testing.md, чтобы отчёт тестов сопоставился с утверждением;
      - уровень выбирай по testing.md: unit, component, module, e2e;
      - утверждения без теста допустимы только с пометкой manual и причиной.
    requires: [specs, design]

  - id: test-plan
    phase: cover
    generates: test-plan.md
    template: test-plan.md
    optional: true
    description: План ручного тестирования
    instruction: |
      Создай план ручной проверки только для утверждений с пометкой manual в coverage.yaml и короткий чеклист для человека перед мержем.
    requires: [coverage]

apply:
  requires: [tasks, coverage]
  tracks: tasks.md
  instruction: |
    Выполни утверждённый план изменения.

    - источник требований — дельты specs/, технических решений — design.md, шагов — tasks.md;
    - выполняй задачи последовательно с учётом зависимостей;
    - защищённые тестовые файлы не меняй; если тест неверен, верни блокер категории «тесты» с доказательством;
    - отмечай задачу `- [x]` только после фактической реализации и прогона проверки;
    - единственная допустимая правка артефактов — отметки в tasks.md;
    - при невыполнимой задаче или расхождении с планом остановись и верни блокер категории «артефакт» с идентификатором артефакта.
