# Тесты проекта с JSON-отчётом как артефактом: его читает верификатор @spec-box/sdd (`sbox coverage --report jest=…`).
name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Тесты с JSON-отчётом
        run: mkdir -p reports && pnpm test -- --reporter=default --reporter=json --outputFile=reports/jest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: reports/
