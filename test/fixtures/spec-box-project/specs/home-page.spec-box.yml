feature: Главная страница
description: Витрина магазина с промо-блоком и корзиной
code: home-page
type: Functional
specs-unit:
  Промо-блок показывает слайды с бэкенда:
    - assert: Отображается карусель со слайдами
    - assert: Для каждого слайда отображаются заголовок, описание и фото
  Блок корзины показывает состав заказа:
    - assert: Отображается количество и общая стоимость товаров в корзине
    - assert: Кнопка «Оформить заказ» ведёт на страницу оформления
definitions:
  page: [home]
